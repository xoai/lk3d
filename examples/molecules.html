<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lk3d · molecules</title>
  <link rel="stylesheet" href="style.css" />
  <main>
    <nav><a href="index.html">← examples</a></nav>
    <h1>Five molecules, to one scale</h1>
    <p>
      The <code>molecule</code> shape draws atoms in their CPK colours from their positions in ångström, as
      ball-and-stick or space-filling models. Choose a molecule to frame it.
    </p>
    <div id="fig"></div>
    <p class="info" id="info"></p>
    <div class="row" id="pick"></div>
  </main>
  <script src="../dist/lk3d.min.js"></script>
  <script type="module">
    import { scene } from './load.js';
    const s = await scene('molecules');
    const fig = LK3D.mount(document.getElementById('fig'), s, {
      info: document.getElementById('info'),
      infoIdle: 'Point at a molecule.',
    });
    for (const [id, label] of [
      ['co2', 'CO₂'],
      ['bf3', 'BF₃'],
      ['ch4', 'CH₄'],
      ['nh3', 'NH₃'],
      ['h2o', 'H₂O'],
    ]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.addEventListener('click', () => fig.focus(s.parts.filter((p) => p.id.startsWith(id)).map((p) => p.id)));
      document.getElementById('pick').append(b);
    }
    // ball-and-stick or space-filling: two pictures of each molecule in one place, shown one at a time
    let model = 'que';
    const show = () => fig.set({ hide: [model === 'que' ? 'dac' : 'que', ...(model === 'dac' ? ['cap'] : [])] });
    const t = document.createElement('button');
    t.type = 'button';
    t.textContent = 'Space-filling';
    t.addEventListener('click', () => {
      model = model === 'que' ? 'dac' : 'que';
      t.textContent = model === 'que' ? 'Space-filling' : 'Ball and stick';
      show();
    });
    document.getElementById('pick').append(t);
    show();
  </script>
</html>
