<!doctype html>
<!-- The image tests' page: ?scene=NAME&look=ink|studio|pen|2d|pen2d[&theme=NAME] draws scenes/NAME.json with the
     built engine (dist/lk3d.min.js) at a fixed size and resolution, with the flows and streams its extras list if
     any, waits until the figure is ready (the crease shading, texture maps), then sets window.__ready to what it drew.
     window.__ink() reads the next picture back as three numbers (how much is drawn, and its middle), for the test of
     transitions that jump. -->
<html lang="en">
  <meta charset="utf-8" /><title>lk3d image test</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      font-family: system-ui, sans-serif;
    }
    #g {
      width: 480px;
    }
    .lk3d {
      margin: 0;
    }
    .lk3d-hint {
      display: none;
    } /* fades on a timer: not part of what is compared */
  </style>
  <div id="g"></div>
  <script src="../../dist/lk3d.min.js"></script>
  <script type="module">
    const q = new URLSearchParams(location.search),
      look = q.get('look') || 'ink',
      flat = /2d$/.test(look),
      errors = [];
    if (q.get('w')) document.getElementById('g').style.width = q.get('w') + 'px'; // (smaller pictures, for the docs)
    window.addEventListener('error', (e) => errors.push(String(e.message)));
    const scene = await (await fetch(`scenes/${q.get('scene')}.json`)).json();
    for (const m of Object.values(scene.models || {})) {
      // a model given as a file: read it into base64, as a build would
      if (m.file && !m.data) {
        const b = new Uint8Array(await (await fetch(m.file)).arrayBuffer());
        let s = '';
        for (const x of b) s += String.fromCharCode(x);
        m.data = btoa(s);
      }
    }
    if (q.get('proj')) scene.view = { ...scene.view, projection: q.get('proj') }; // ?proj=ortho
    const fig = LK3D.mount(document.getElementById('g'), scene, {
      controls: false,
      adaptive: false,
      maxDpr: 1,
      locale: 'en',
      labels: 'none',
      style: flat ? look.slice(0, -2) || 'ink' : look,
      theme: q.get('theme') || undefined,
      force2d: flat,
    });
    for (const f of scene.extras?.flows || []) fig.flow(f);
    for (const f of scene.extras?.streams || []) fig.stream(f);
    const frame = () => new Promise((r) => requestAnimationFrame(() => r()));
    // complete: the crease shading, the edges, every texture (the cell's crease shading takes about 8 s in Firefox here,
    // over 30 s on CI's machines, which draw in software); at most 90 s, and the test says if it was not
    const complete = await Promise.race([
      fig.ready.then(() => true),
      new Promise((r) => setTimeout(() => r(false), 90000)),
    ]);
    await frame();
    await frame();
    window.__fig = fig; // (for the docs' pictures)
    // the next picture, read back right after the figure draws it (a later callback of the same frame), shrunk: how
    // much is drawn (coverage and darkness) and the middle of it
    window.__ink = () =>
      new Promise((r) =>
        requestAnimationFrame(() => {
          const c = document.querySelector('.lk3d-canvas'),
            w = 160,
            h = Math.round((c.height * w) / c.width),
            x = Object.assign(document.createElement('canvas'), { width: w, height: h }).getContext('2d', {
              willReadFrequently: true,
            });
          x.drawImage(c, 0, 0, w, h);
          const d = x.getImageData(0, 0, w, h).data;
          let ink = 0,
            sx = 0,
            sy = 0;
          for (let i = 0; i < w * h; i++) {
            const a = d[4 * i + 3] / 255,
              v = a * (2 - (d[4 * i] + d[4 * i + 1] + d[4 * i + 2]) / 765);
            ink += v;
            sx += v * (i % w);
            sy += v * Math.floor(i / w);
          }
          r([ink / (w * h), sx / ink / w, sy / ink / h]);
        }),
      );
    window.__ready = { renderer: fig.renderer, errors, triangles: fig.stats().triangles, complete };
  </script>
</html>
